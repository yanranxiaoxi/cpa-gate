<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>CPA Gate</title>
	<meta name="description" content="CLIProxyAPI 入口：使用 SSO 登录获取 API 密钥" />
	<meta name="color-scheme" content="light" />
	<meta name="theme-color" content="#ffffff" />
	<!-- 首屏主题：在样式表之前同步应用，避免闪白，并让 Dark Reader 等扩展读出原生暗色 -->
	<script>
		(function () {
			var stored = null;
			try {
				stored = localStorage.getItem('cpa-theme');
			}
			catch {
				// 隐私模式下读取失败，按系统偏好处理
			}
			var theme = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
			document.documentElement.setAttribute('data-theme', theme);
			var scheme = document.querySelector('meta[name="color-scheme"]');
			if (scheme) {
				scheme.setAttribute('content', theme);
			}
			var chromeColor = document.querySelector('meta[name="theme-color"]');
			if (chromeColor) {
				chromeColor.setAttribute('content', theme === 'dark' ? '#0e1116' : '#ffffff');
			}
		})();
	</script>
	<link rel="manifest" href="/manifest.webmanifest" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="apple-touch-icon" href="/icons/icon-192.png" />
	<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
	<div id="app"></div>
	<noscript>
		<p style="text-align:center;padding:2rem">Please enable JavaScript to use CPA Gate.</p>
	</noscript>
	<script type="module" src="/assets/main-EMSTU7XE.js"></script>
</body>
</html>
